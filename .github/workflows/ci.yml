name: DevSecOps CI Pipeline

on:
  push:
    branches: [ "main", "master", "develop" ]
  pull_request:
    branches: [ "main", "master", "develop" ]

permissions:
  contents: read
  security-events: write

jobs:
  build-and-test:
    name: Build, Security Audit & Regression Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore NuGet Packages
        run: dotnet restore ClinicBookingSystem.sln

      - name: Build Solution (Release)
        run: dotnet build ClinicBookingSystem.sln -c Release --no-restore

      - name: Dependency Vulnerability Check
        run: |
          echo "Scanning NuGet packages for known vulnerabilities..."
          dotnet list package --vulnerable --include-transitive

      - name: Run Security & Functional Regression Suite
        run: |
          echo "Running all Unit, Integration, Multi-Tenant, and Security Matrix tests..."
          dotnet test ClinicBookingSystem.sln \
            -c Release \
            --no-build \
            --logger "trx;LogFileName=test-results.trx" \
            --collect:"XPlat Code Coverage"

      - name: Publish API Application
        run: |
          echo "Publishing API artifact..."
          dotnet publish src/ClinicBookingSystem.API/ClinicBookingSystem.API.csproj \
            -c Release \
            --no-build \
            --output ./publish

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: clinic-booking-api-bundle
          path: ./publish
          retention-days: 7
